[project]
name = "storageflow"
version = "0.1.0"
description = ""
authors = [{ name = "tvoosa", email = "tvoosa@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "google-cloud-dataproc (>=5.20.0,<6.0.0)",
  "pydantic (>=2.11.7,<3.0.0)",
  "fastapi (>=0.115.13)",
  "google-cloud-logging (>=3.12.1,<4.0.0)",
  "jinja2 (>=3.1.6,<4.0.0)",
  "uvicorn (>=0.34.3,<0.35.0)",
  "proto-plus (>=1.26.1,<2.0.0)",
  "protobuf (>=6.31.1,<7.0.0)",
  "isodate (>=0.7.2,<0.8.0)",
  "google-cloud-storage (>=3.2.0,<4.0.0)",
  "google-cloud-tasks (>=2.19.3,<3.0.0)",
  "google-cloud-firestore (>=2.21.0,<3.0.0)",
  "aiohttp (>=3.12.14,<4.0.0)",
  "python-ulid[pydantic] (>=3.0.0,<4.0.0)",
  "google-cloud-workflows (>=1.18.2,<2.0.0)",
  "watchfiles (>=1.1.0,<2.0.0)",
  "gapic-google-longrunning (>=0.11.2,<0.12.0)",
]


[tool.poetry]
packages = [{ include = "storageflow", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<4"
rsa = ">=4.7"
starlette = ">=0.47.2"

[tool.poetry.group.dev.dependencies]
pytest-datadir-ng = "^1.1.1"
pytest = "^8.4.0"
pytest-asyncio = "^1.0.0"
httpx = "^0.28.1"
pyspark = ">=4.0.0,<5.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["**/src"]
ignore = ["**/tests", ".TRASH"]
